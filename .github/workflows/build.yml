name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SM_BUILD: 1.12.0-git7259
      STEAMWORKS_INC_COMMIT: f0c1b62dff615511b27824aaa2815c7dc58d2716
    steps:
      - uses: actions/checkout@v4

      - name: SourceMod 1.12
        run: |
          curl -fsSL "https://sm.alliedmods.net/smdrop/1.12/sourcemod-${SM_BUILD}-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          curl -fsSL -o "$RUNNER_TEMP/addons/sourcemod/scripting/include/SteamWorks.inc" \
            "https://raw.githubusercontent.com/KyleSanderson/SteamWorks/${STEAMWORKS_INC_COMMIT}/Pawn/includes/SteamWorks.inc"

      - name: Compilation des plugins
        working-directory: cstrike/addons/sourcemod/scripting
        run: |
          mkdir -p "$RUNNER_TEMP/plugins"
          for sp in *.sp; do
            "$RUNNER_TEMP/addons/sourcemod/scripting/spcomp64" "$sp" \
              -i"$RUNNER_TEMP/addons/sourcemod/scripting/include" -E -o"$RUNNER_TEMP/plugins/${sp%.sp}.smx"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ${{ runner.temp }}/plugins
